# pyproject.toml
# Описание проекта adperf (Ad Performance Analytics) и его зависимостей.
# Установка для разработки:  pip install -e ".[dev]"

[build-system]
# Сборщик пакета: setuptools читает src/-раскладку проекта.
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adperf"
version = "0.1.0"
description = "Ad campaign performance analytics for an EdTech subscription school"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Anna Ivanova" }]

# Основные зависимости (нужны для работы самой системы).
# Верхние границы у pandas, SQLAlchemy и pydantic защищают от внезапных
# несовместимых мажорных обновлений: в занятии 2 мы дополнительно зафиксируем
# точные версии в requirements-lock.txt.
dependencies = [
    "sqlalchemy>=2.0.30,<2.1",   # ORM и работа с БД (SQLite, позже PostgreSQL)
    "alembic>=1.13",             # миграции схемы БД
    "pandas>=2.2,<3",            # табличная аналитика
    "numpy>=1.26",               # численные расчёты
    "plotly>=5.22",              # интерактивные графики
    "matplotlib>=3.9",           # статичные графики для отчётов
    "typer>=0.12",               # командная строка (CLI)
    "streamlit>=1.36",           # веб-дашборд
    "pydantic>=2.7,<3",          # валидация данных
    "pydantic-settings>=2.3",    # настройки из .env
    "loguru>=0.7",               # логирование
    "Faker>=25",                 # генерация синтетических данных
    "Jinja2>=3.1",               # шаблоны HTML-отчётов
    "openpyxl>=3.1",             # экспорт в Excel
    "rich>=13.7",                # красивые таблицы в консоли
    "PyYAML>=6",                 # YAML-маппинги колонок для адаптеров
    "Babel>=2.15",               # форматирование чисел и валют
]

[project.optional-dependencies]
# Инструменты разработки: тесты, линтеры, типы, pre-commit.
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "black>=24",
    "mypy>=1.10",
    "pandas-stubs>=2.2,<3",
    "pre-commit>=3.7",
]
# Необязательный REST API (занятие 55): pip install -e ".[api]"
api = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]   # пакеты ищем в папке src/

# --- Настройки инструментов (базовые, расширим в занятиях 56-62) ---

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F — ошибки и pyflakes, I — сортировка импортов, UP — современный синтаксис, B — багбеар
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true